<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <figure class="card">
        <div class="image"></div>

        <figcaption class="description">
          <p class="tag text-small-bold">Learning</p>
          <p class="text-small">Published 21 Dec 2023</p>
          <h1 class="text-extra-bold hover-yellow">HTML & CSS foundations</h1>
          <p class="color-gray-500 text-medium">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </figcaption>

        <figure class="author">
          <img
            width="32"
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper photo"
          />
          <figcaption class="text-small-bold">Greg Hooper</figcaption>
        </figure>
      </figure>
    </main>
  </body>
</html>
